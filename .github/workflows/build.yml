name: Build Android APK & Deploy Web App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      publish_android_update:
        description: 'ساخت نسخه جدید اندروید و ارسال پیغام آپدیت به کاربران؟'
        type: boolean
        default: true

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-android:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.publish_android_update == 'true'
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: 'https://kvkgyrifhqiukgjkojyx.supabase.co'
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Setup Consistent Signing Keystore
        run: |
          mkdir -p ~/.android
          if [ -n "$SUPABASE_SERVICE_KEY" ]; then
            python3 - << 'EOF'
          import json, os, subprocess, urllib.request, urllib.error

          url = os.environ['SUPABASE_URL']
          key = os.environ['SUPABASE_SERVICE_KEY']
          ks_path = os.path.expanduser('~/.android/debug.keystore')
          headers = {'apikey': key, 'Authorization': f'Bearer {key}'}

          # ساخت باکت خصوصی app-keys در صورت نبود
          try:
              req = urllib.request.Request(
                  f"{url}/storage/v1/bucket",
                  data=json.dumps({"id": "app-keys", "name": "app-keys", "public": False}).encode(),
                  headers={**headers, 'Content-Type': 'application/json'},
                  method='POST',
              )
              urllib.request.urlopen(req)
          except Exception:
              pass

          # دریافت کلید امضای ثابت یا ساخت و ذخیره آن برای همیشه
          try:
              req = urllib.request.Request(f"{url}/storage/v1/object/app-keys/debug.keystore", headers=headers)
              with urllib.request.urlopen(req) as resp:
                  with open(ks_path, 'wb') as f:
                      f.write(resp.read())
              print("Loaded existing consistent signing keystore.")
          except Exception:
              subprocess.run([
                  "keytool", "-genkey", "-v",
                  "-keystore", ks_path,
                  "-storepass", "android",
                  "-alias", "androiddebugkey",
                  "-keypass", "android",
                  "-keyalg", "RSA", "-keysize", "2048", "-validity", "10000",
                  "-dname", "CN=HA Tasks,O=HA,C=IR"
              ], check=True)
              with open(ks_path, 'rb') as f:
                  data = f.read()
              req = urllib.request.Request(
                  f"{url}/storage/v1/object/app-keys/debug.keystore",
                  data=data,
                  headers={**headers, 'Content-Type': 'application/octet-stream', 'x-upsert': 'true'},
                  method='POST',
              )
              urllib.request.urlopen(req)
              print("Created and saved new consistent signing keystore.")
          EOF
          fi

      - name: Generate Android files, Font & Green H.A. Logo
        run: |
          flutter create . --platforms=android
          git checkout -- pubspec.yaml lib/
          sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET"\/>\n    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES"\/>\n    <application/' android/app/src/main/AndroidManifest.xml
          sed -i 's/android:label="[^"]*"/android:label="H.A. Tasks"/' android/app/src/main/AndroidManifest.xml
          mkdir -p assets/fonts
          curl -fL "https://raw.githubusercontent.com/rastikerdar/vazirmatn/v33.003/fonts/ttf/Vazirmatn-Regular.ttf" -o assets/fonts/Vazirmatn-Regular.ttf
          curl -fL "https://raw.githubusercontent.com/rastikerdar/vazirmatn/v33.003/fonts/ttf/Vazirmatn-Bold.ttf" -o assets/fonts/Vazirmatn-Bold.ttf
          python3 -m pip install -q pillow
          python3 - << 'EOF'
          from PIL import Image, ImageDraw, ImageFont
          import os
          img = Image.new("RGBA", (512, 512), (0, 0, 0, 0))
          d = ImageDraw.Draw(img)
          d.rounded_rectangle([24, 24, 488, 488], radius=105, fill=(22, 163, 74, 255))
          d.line([(125, 220), (215, 310), (390, 125)], fill=(255, 255, 255, 255), width=42, joint="curve")
          try:
              font = ImageFont.truetype("assets/fonts/Vazirmatn-Bold.ttf", 112)
          except Exception:
              font = ImageFont.load_default()
          bbox = d.textbbox((0, 0), "H.A.", font=font)
          tw = bbox[2] - bbox[0]
          d.text(((512 - tw) / 2, 330), "H.A.", fill=(255, 255, 255, 255), font=font)
          sizes = {"mipmap-mdpi": 48, "mipmap-hdpi": 72, "mipmap-xhdpi": 96, "mipmap-xxhdpi": 144, "mipmap-xxxhdpi": 192}
          for folder, sz in sizes.items():
              path = f"android/app/src/main/res/{folder}"
              os.makedirs(path, exist_ok=True)
              img.resize((sz, sz), Image.LANCZOS).save(f"{path}/ic_launcher.png")
          EOF

      - name: Build APK
        run: |
          flutter pub get
          flutter build apk --release \
            --build-number=${{ github.run_number }} \
            --dart-define=APP_BUILD_NUMBER=${{ github.run_number }}

      - name: Publish Latest Android Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk app-release.apk
          echo "{\"build\": ${{ github.run_number }}, \"apk_url\": \"https://github.com/${{ github.repository }}/releases/latest/download/app-release.apk\"}" > version.json
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest app-release.apk version.json --clobber
            gh release edit latest --title "H.A. Tasks Android (Build #${{ github.run_number }})"
          else
            gh release create latest app-release.apk version.json \
              --title "H.A. Tasks Android (Build #${{ github.run_number }})" \
              --notes "آخرین نسخه اپلیکیشن اندروید H.A. Tasks"
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HA-Tasks-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk

  build-and-deploy-web:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate Web files, Font & Green H.A. Logo
        run: |
          flutter create . --platforms=web
          git checkout -- pubspec.yaml lib/
          mkdir -p assets/fonts
          curl -fL "https://raw.githubusercontent.com/rastikerdar/vazirmatn/v33.003/fonts/ttf/Vazirmatn-Regular.ttf" -o assets/fonts/Vazirmatn-Regular.ttf
          curl -fL "https://raw.githubusercontent.com/rastikerdar/vazirmatn/v33.003/fonts/ttf/Vazirmatn-Bold.ttf" -o assets/fonts/Vazirmatn-Bold.ttf
          python3 -m pip install -q pillow
          python3 - << 'EOF'
          from PIL import Image, ImageDraw, ImageFont
          img = Image.new("RGBA", (512, 512), (0, 0, 0, 0))
          d = ImageDraw.Draw(img)
          d.rounded_rectangle([24, 24, 488, 488], radius=105, fill=(22, 163, 74, 255))
          d.line([(125, 220), (215, 310), (390, 125)], fill=(255, 255, 255, 255), width=42, joint="curve")
          try:
              font = ImageFont.truetype("assets/fonts/Vazirmatn-Bold.ttf", 112)
          except Exception:
              font = ImageFont.load_default()
          bbox = d.textbbox((0, 0), "H.A.", font=font)
          tw = bbox[2] - bbox[0]
          d.text(((512 - tw) / 2, 330), "H.A.", fill=(255, 255, 255, 255), font=font)
          img.resize((64, 64), Image.LANCZOS).save("web/favicon.png")
          img.resize((192, 192), Image.LANCZOS).save("web/icons/Icon-192.png")
          img.resize((512, 512), Image.LANCZOS).save("web/icons/Icon-512.png")
          img.resize((192, 192), Image.LANCZOS).save("web/icons/Icon-maskable-192.png")
          img.resize((512, 512), Image.LANCZOS).save("web/icons/Icon-maskable-512.png")
          EOF
          sed -i 's/<title>[^<]*<\/title>/<title>H.A. Tasks<\/title>/' web/index.html
          flutter pub get
          flutter build web --release --base-href "/${{ github.event.repository.name }}/"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Web Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
