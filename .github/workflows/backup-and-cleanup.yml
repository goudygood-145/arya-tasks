name: Monthly Backup & 90-Day Trash Cleanup

on:
  schedule:
    # یکم هر ماه میلادی ساعت ۶ صبح: بکاپ کامل فشرده (ZIP) + ارسال ایمیل
    - cron: '0 6 1 * *'
    # هر ۳ روز یک‌بار ساعت ۷ صبح: حذف بکاپ‌های قدیمی‌تر از ۲ هفته و تسک‌های حذف‌شده بالای ۹۰ روز
    - cron: '0 7 */3 * *'
  workflow_dispatch:
    inputs:
      run_backup_now:
        description: 'همین الان بکاپ زیپ‌شده گرفته و ایمیل ارسال شود؟'
        type: boolean
        default: true

jobs:
  maintenance:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: 'https://kvkgyrifhqiukgjkojyx.supabase.co'
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      SMTP_EMAIL: ${{ secrets.SMTP_EMAIL }}
      SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
      BACKUP_TO_EMAIL: ${{ secrets.BACKUP_TO_EMAIL }}
      EVENT_NAME: ${{ github.event_name }}
      EVENT_CRON: ${{ github.event.schedule }}
      MANUAL_BACKUP: ${{ inputs.run_backup_now }}
    steps:
      - name: Run Backup and Cleanup Script
        run: |
          python3 - << 'EOF'
          import io, json, os, smtplib, urllib.error, urllib.request, urllib.parse, zipfile
          from datetime import datetime, timedelta, timezone
          from email.message import EmailMessage

          URL = os.environ['SUPABASE_URL'].rstrip('/')
          KEY = os.environ['SUPABASE_SERVICE_KEY'].strip()

          if not KEY or KEY.startswith('sb_publishable_'):
              raise SystemExit("ERROR: SUPABASE_SERVICE_KEY must be the Secret key (sb_secret_...) or legacy service_role key, NOT sb_publishable_.")

          HEADERS = {
              'apikey': KEY,
              'Content-Type': 'application/json',
              'User-Agent': 'HA-Tasks-Backup/1.0',
          }
          if KEY.startswith('eyJ'):
              HEADERS['Authorization'] = f'Bearer {KEY}'

          def req(method, path, body=None, extra_headers=None):
              h = dict(HEADERS)
              if extra_headers:
                  h.update(extra_headers)
              data = None
              if body is not None:
                  data = body if isinstance(body, bytes) else json.dumps(body).encode('utf-8')
              r = urllib.request.Request(f"{URL}{path}", data=data, headers=h, method=method)
              try:
                  with urllib.request.urlopen(r) as resp:
                      raw = resp.read()
                      return json.loads(raw.decode('utf-8')) if raw else {}
              except urllib.error.HTTPError as e:
                  err_body = e.read().decode('utf-8', errors='ignore')
                  print(f"HTTP {e.code} on {method} {path}: {err_body}")
                  raise

          now = datetime.now(timezone.utc)

          # ۱. پاکسازی خودکار فایل‌های بکاپ قدیمی‌تر از ۱۴ روز (۲ هفته)
          try:
              backups = req('POST', '/storage/v1/object/list/backups', {'prefix': '', 'limit': 100})
              old_backups = []
              cutoff_14 = now - timedelta(days=14)
              for b in backups:
                  created = b.get('created_at')
                  if created:
                      dt = datetime.fromisoformat(created.replace('Z', '+00:00'))
                      if dt < cutoff_14:
                          old_backups.append(b['name'])
              if old_backups:
                  req('DELETE', '/storage/v1/object/backups', {'prefixes': old_backups})
                  print(f"Deleted {len(old_backups)} old backup(s).")
          except Exception as e:
              print("Backup cleanup warning:", e)

          # ۲. پاکسازی دائمی تسک‌های حذف‌شده قدیمی‌تر از ۹۰ روز
          try:
              cutoff_90 = (now - timedelta(days=90)).isoformat()
              q = urllib.parse.quote(cutoff_90)
              expired_tasks = req('GET', f'/rest/v1/tasks?deleted_at=lt.{q}&select=id')
              for t in expired_tasks:
                  tid = t['id']
                  atts = req('GET', f'/rest/v1/task_attachments?task_id=eq.{tid}&select=file_path')
                  paths = [a['file_path'] for a in atts if a.get('file_path')]
                  if paths:
                      req('DELETE', '/storage/v1/object/task-files', {'prefixes': paths})
                  req('DELETE', f'/rest/v1/tasks?id=eq.{tid}')
              print(f"Permanently purged {len(expired_tasks)} expired task(s).")
          except Exception as e:
              print("Trash purge warning:", e)

          # ۳. بکاپ ماهانه کامل به صورت ZIP و ارسال لینک دانلود به ایمیل
          should_backup = (
              os.environ.get('EVENT_CRON') == '0 6 1 * *'
              or (os.environ.get('EVENT_NAME') == 'workflow_dispatch' and os.environ.get('MANUAL_BACKUP', 'true') == 'true')
          )

          if should_backup:
              tables = [
                  'profiles', 'lists', 'list_members', 'tasks',
                  'subtasks', 'comments', 'note_history', 'activity_logs', 'task_attachments'
              ]
              dump = {'exported_at': now.isoformat()}
              for tbl in tables:
                  dump[tbl] = req('GET', f'/rest/v1/{tbl}?select=*')

              stamp = now.strftime('%Y-%m-%d_%H-%M')
              json_name = f"ha-tasks-backup-{stamp}.json"
              zip_name = f"ha-tasks-backup-{stamp}.zip"

              json_bytes = json.dumps(dump, ensure_ascii=False, separators=(',', ':')).encode('utf-8')
              buf = io.BytesIO()
              with zipfile.ZipFile(buf, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=9) as zf:
                  zf.writestr(json_name, json_bytes)
              zip_bytes = buf.getvalue()

              req('POST', f'/storage/v1/object/backups/{zip_name}', zip_bytes, {
                  'Content-Type': 'application/zip',
                  'x-upsert': 'true',
              })

              sign_res = req('POST', f'/storage/v1/object/sign/backups/{zip_name}', {'expiresIn': 1209600})
              download_url = f"{URL}/storage/v1{sign_res['signedURL']}"

              msg = EmailMessage()
              msg['Subject'] = f"بکاپ ماهانه فشرده (ZIP) دیتابیس H.A. Tasks ({now.strftime('%Y-%m-%d')})"
              msg['From'] = os.environ['SMTP_EMAIL']
              msg['To'] = os.environ['BACKUP_TO_EMAIL']
              msg.set_content(
                  f"سلام،\n\n"
                  f"نسخه پشتیبان کامل و فشرده دیتابیس H.A. Tasks آماده شد.\n"
                  f"حجم فایل فشرده: {len(zip_bytes) / 1024:.1f} کیلوبایت\n\n"
                  f"لینک دانلود مستقیم فایل ZIP (معتبر به مدت ۱۴ روز):\n{download_url}\n\n"
                  f"نکات مهم:\n"
                  f"- این فایل پس از ۲ هفته به‌صورت خودکار از سرور پاک می‌شود تا فضایی اشغال نکند.\n"
                  f"- در صورت نیاز به بازیابی، ابتدا فایل ZIP را از حالت فشرده خارج کنید و سپس فایل .json داخل آن را از طریق دکمه «بازیابی از فایل بکاپ» در برنامه انتخاب نمایید.\n"
              )

              with smtplib.SMTP_SSL('smtp.gmail.com', 465) as smtp:
                  smtp.login(os.environ['SMTP_EMAIL'], os.environ['SMTP_APP_PASSWORD'])
                  smtp.send_message(msg)
              print(f"Monthly ZIP backup created ({len(zip_bytes)} bytes) and emailed successfully.")
          EOF
