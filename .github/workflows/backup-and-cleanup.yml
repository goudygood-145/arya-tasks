name: Monthly Backup & 90-Day Trash Cleanup

on:
  schedule:
    # اجرای روزانه ساعت ۲:۳۰ بامداد UTC (۶:۰۰ صبح به وقت ایران)
    # بکاپ خودکار فقط در روز «یکم هر ماه شمسی» گرفته می‌شود
    - cron: '30 2 * * *'
  workflow_dispatch:
    inputs:
      run_backup_now:
        description: 'همین الان بکاپ گرفته و ایمیل ارسال شود؟'
        type: boolean
        default: true
      include_files:
        description: 'همراه با تمام فایل‌های آپلودشده؟ (بکاپ کامل)'
        type: boolean
        default: false

jobs:
  maintenance:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: 'https://kvkgyrifhqiukgjkojyx.supabase.co'
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      SMTP_EMAIL: ${{ secrets.SMTP_EMAIL }}
      SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
      BACKUP_TO_EMAIL: ${{ secrets.BACKUP_TO_EMAIL }}
      EVENT_NAME: ${{ github.event_name }}
      MANUAL_BACKUP: ${{ inputs.run_backup_now }}
      INCLUDE_FILES: ${{ inputs.include_files }}
    steps:
      - name: Run Backup and Cleanup Script
        run: |
          python3 - << 'EOF'
          import io, json, os, smtplib, urllib.error, urllib.request, urllib.parse, zipfile
          from datetime import datetime, timedelta, timezone
          from email.message import EmailMessage

          URL = os.environ['SUPABASE_URL'].rstrip('/')
          KEY = os.environ['SUPABASE_SERVICE_KEY'].strip()

          if not KEY or KEY.startswith('sb_publishable_'):
              raise SystemExit("ERROR: SUPABASE_SERVICE_KEY must be the Secret key (sb_secret_...) or legacy service_role key.")

          HEADERS = {
              'apikey': KEY,
              'Content-Type': 'application/json',
              'User-Agent': 'HA-Tasks-Backup/1.0',
          }
          if KEY.startswith('eyJ'):
              HEADERS['Authorization'] = f'Bearer {KEY}'

          def gregorian_to_jalali(gy, gm, gd):
              g_d_m = [0, 31, 59, 90, 120, 151, 181, 212, 243, 273, 304, 334]
              gy2 = gy + 1 if gm > 2 else gy
              days = 355666 + (365 * gy) + ((gy2 + 3) // 4) - ((gy2 + 99) // 100) + ((gy2 + 399) // 400) + gd + g_d_m[gm - 1]
              jy = -1595 + (33 * (days // 12053))
              days %= 12053
              jy += 4 * (days // 1461)
              days %= 1461
              if days > 365:
                  jy += (days - 1) // 365
                  days = (days - 1) % 365
              if days < 186:
                  jm = 1 + (days // 31)
                  jd = 1 + (days % 31)
              else:
                  jm = 7 + ((days - 186) // 30)
                  jd = 1 + ((days - 186) % 30)
              return jy, jm, jd

          def req(method, path, body=None, extra_headers=None, raw_response=False):
              h = dict(HEADERS)
              if extra_headers:
                  h.update(extra_headers)
              data = None
              if body is not None:
                  data = body if isinstance(body, bytes) else json.dumps(body).encode('utf-8')
              r = urllib.request.Request(f"{URL}{path}", data=data, headers=h, method=method)
              try:
                  with urllib.request.urlopen(r) as resp:
                      raw = resp.read()
                      if raw_response:
                          return raw
                      return json.loads(raw.decode('utf-8')) if raw else {}
              except urllib.error.HTTPError as e:
                  err_body = e.read().decode('utf-8', errors='ignore')
                  print(f"HTTP {e.code} on {method} {path}: {err_body}")
                  raise

          now = datetime.now(timezone.utc)
          tehran_now = now + timedelta(hours=3, minutes=30)
          jy, jm, jd = gregorian_to_jalali(tehran_now.year, tehran_now.month, tehran_now.day)
          jalali_str = f"{jy:04d}-{jm:02d}-{jd:02d}"
          print(f"Tehran Jalali Date: {jalali_str}")

          # ۱. پاکسازی خودکار فایل‌های بکاپ قدیمی‌تر از ۱۴ روز (۲ هفته)
          try:
              backups = req('POST', '/storage/v1/object/list/backups', {'prefix': '', 'limit': 100})
              old_backups = []
              cutoff_14 = now - timedelta(days=14)
              for b in backups:
                  created = b.get('created_at')
                  if created:
                      dt = datetime.fromisoformat(created.replace('Z', '+00:00'))
                      if dt < cutoff_14:
                          old_backups.append(b['name'])
              if old_backups:
                  req('DELETE', '/storage/v1/object/backups', {'prefixes': old_backups})
                  print(f"Deleted {len(old_backups)} old backup(s).")
          except Exception as e:
              print("Backup cleanup warning:", e)

          # ۲. پاکسازی دائمی تسک‌های حذف‌شده قدیمی‌تر از ۹۰ روز
          try:
              cutoff_90 = (now - timedelta(days=90)).isoformat()
              q = urllib.parse.quote(cutoff_90)
              expired_tasks = req('GET', f'/rest/v1/tasks?deleted_at=lt.{q}&select=id')
              for t in expired_tasks:
                  tid = t['id']
                  atts = req('GET', f'/rest/v1/task_attachments?task_id=eq.{tid}&select=file_path')
                  paths = [a['file_path'] for a in atts if a.get('file_path')]
                  if paths:
                      req('DELETE', '/storage/v1/object/task-files', {'prefixes': paths})
                  req('DELETE', f'/rest/v1/tasks?id=eq.{tid}')
              print(f"Permanently purged {len(expired_tasks)} expired task(s).")
          except Exception as e:
              print("Trash purge warning:", e)

          # ۳. تهیه بکاپ: یکم هر ماه شمسی یا اجرای دستی
          is_manual = os.environ.get('EVENT_NAME') == 'workflow_dispatch'
          is_first_of_shamsi_month = (os.environ.get('EVENT_NAME') == 'schedule' and jd == 1)
          should_backup = (
              is_first_of_shamsi_month
              or (is_manual and os.environ.get('MANUAL_BACKUP', 'true') == 'true')
          )
          include_files = is_manual and os.environ.get('INCLUDE_FILES', 'false') == 'true'

          if should_backup:
              tables = [
                  'profiles', 'lists', 'list_members', 'tasks',
                  'subtasks', 'comments', 'note_history', 'activity_logs', 'task_attachments'
              ]
              dump = {'exported_at': now.isoformat(), 'jalali_date': jalali_str}
              for tbl in tables:
                  dump[tbl] = req('GET', f'/rest/v1/{tbl}?select=*')

              stamp = f"{jalali_str}_{tehran_now.strftime('%H-%M')}"
              suffix = 'full-with-files' if include_files else 'db-only'
              json_name = f"ha-tasks-backup-{stamp}.json"
              zip_name = f"ha-tasks-backup-{suffix}-{stamp}.zip"

              json_bytes = json.dumps(dump, ensure_ascii=False, separators=(',', ':')).encode('utf-8')
              buf = io.BytesIO()
              files_count = 0

              with zipfile.ZipFile(buf, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=9) as zf:
                  zf.writestr(json_name, json_bytes)
                  if include_files:
                      used_names = set()
                      for att in dump.get('task_attachments', []):
                          fpath = att.get('file_path')
                          fname = att.get('file_name') or 'file'
                          tid = att.get('task_id') or 'unknown'
                          if not fpath:
                              continue
                          try:
                              encoded_path = urllib.parse.quote(fpath, safe='/')
                              file_bytes = req('GET', f'/storage/v1/object/task-files/{encoded_path}', raw_response=True)
                              arc_name = f"files/{tid}/{fname}"
                              if arc_name in used_names:
                                  arc_name = f"files/{tid}/{att.get('id', files_count)}_{fname}"
                              used_names.add(arc_name)
                              zf.writestr(arc_name, file_bytes)
                              files_count += 1
                          except Exception as fe:
                              print(f"Skipped missing file {fpath}: {fe}")

              zip_bytes = buf.getvalue()

              req('POST', f'/storage/v1/object/backups/{zip_name}', zip_bytes, {
                  'Content-Type': 'application/zip',
                  'x-upsert': 'true',
              })

              sign_res = req('POST', f'/storage/v1/object/sign/backups/{zip_name}', {'expiresIn': 1209600})
              download_url = f"{URL}/storage/v1{sign_res['signedURL']}"

              size_mb = len(zip_bytes) / (1024 * 1024)
              size_text = f"{size_mb:.2f} مگابایت" if size_mb >= 1 else f"{len(zip_bytes) / 1024:.1f} کیلوبایت"
              mode_text = f"کامل (دیتابیس + {files_count} فایل ضمیمه)" if include_files else "فقط دیتابیس"

              msg = EmailMessage()
              msg['Subject'] = f"بکاپ {mode_text} H.A. Tasks ({jalali_str})"
              msg['From'] = os.environ['SMTP_EMAIL']
              msg['To'] = os.environ['BACKUP_TO_EMAIL']
              msg.set_content(
                  f"سلام،\n\n"
                  f"نسخه پشتیبان H.A. Tasks برای تاریخ {jalali_str} با موفقیت آماده شد.\n"
                  f"نوع بکاپ: {mode_text}\n"
                  f"حجم فایل فشرده: {size_text}\n\n"
                  f"لینک دانلود مستقیم فایل ZIP (معتبر به مدت ۱۴ روز):\n{download_url}\n\n"
                  f"نکات مهم:\n"
                  f"- این فایل پس از ۲ هفته به‌صورت خودکار از سرور پاک می‌شود تا فضایی اشغال نکند.\n"
                  f"- برای بازیابی دیتابیس، فایل ZIP را از حالت فشرده خارج کنید و فایل .json داخل آن را در بخش «بازیابی از فایل بکاپ» برنامه انتخاب نمایید.\n"
              )

              with smtplib.SMTP_SSL('smtp.gmail.com', 465) as smtp:
                  smtp.login(os.environ['SMTP_EMAIL'], os.environ['SMTP_APP_PASSWORD'])
                  smtp.send_message(msg)
              print(f"Backup ({mode_text}) created ({len(zip_bytes)} bytes) and emailed successfully.")
          else:
              print("Not the 1st of Shamsi month; skipped monthly backup.")
          EOF
